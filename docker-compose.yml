name: physiodoc

services:
  app:
    build: .
    container_name: physiodoc
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WHISPER_API_URL=${WHISPER_API_URL:-http://host.docker.internal:8100}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=qwen3.5:9b
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - USE_MOCKS=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - physiodoc-uploads:/app/uploads
      - physiodoc-data:/app/data

volumes:
  physiodoc-uploads:
  physiodoc-data:
